name: Publish viewer

on:
  push:
    branches: [main]
    paths:
      - src/slopscope_web/static/**
      - .github/workflows/pages.yml
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public viewer files
        run: |
          mkdir -p _site
          cp -R src/slopscope_web/static/. _site/
          cp LICENSE _site/LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
