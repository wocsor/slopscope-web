[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopscope-web"
version = "0.1.0"
description = "SlopScope WebUSB viewer with an optional Python USB bridge"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bridge = ["slopscope-usb>=0.1.0"]

[project.scripts]
slopscope-web = "slopscope_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopscope_web = ["static/*.html", "static/*.js", "static/*.css", "static/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
